<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Puppet Theater</title>
  <link rel="stylesheet" href="/viewer.css" />
</head>
<body>
  <!-- The stage is the page: everything else is a title, a line and one glyph. -->
  <div id="house"><div id="stage-wrap"></div></div>

  <div id="bill">
    <h1 id="title"></h1>
    <p id="notice" hidden></p>
    <!-- Landing only, and only until the visitor's own play takes over. -->
    <p id="byline" hidden></p>
  </div>

  <div id="controls">
    <button id="play" type="button" aria-label="Play">
      <svg viewBox="0 0 14 16" width="13" height="15" aria-hidden="true">
        <path class="play" d="M1,0 L13,8 L1,16 Z" />
        <g class="pause"><rect x="1" y="0" width="4" height="16" /><rect x="9" y="0" width="4" height="16" /></g>
      </svg>
    </button>
    <div id="track" role="slider" aria-label="Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="line"></div>
      <div class="elapsed" id="elapsed"></div>
      <div class="head" id="head"></div>
    </div>
  </div>

  <!-- The lower-right corner: one button, and the chat above it. -->
  <button id="chat-open" type="button" aria-label="Open the chat"
          aria-expanded="false" aria-controls="chat">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
      <path d="M3.2 13.6 12.9 3.9a1.6 1.6 0 0 1 2.3 0l.9.9a1.6 1.6 0 0 1 0 2.3L6.4 16.8 2.6 17.4Z" />
      <path d="M11.6 5.2l3.2 3.2" />
    </svg>
  </button>

  <section id="chat" role="dialog" aria-label="Chat" hidden>
    <div id="chat-log" role="log" aria-live="polite">
      <p class="empty">Connect with MCP at <code id="mcp-url"></code> or type below.</p>
    </div>
    <form id="chat-form">
      <label class="vh" for="chat-input">Your message</label>
      <textarea id="chat-input" rows="1" autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>
      <button class="vh" type="submit">Send</button>
    </form>
  </section>

  <script type="module" src="/viewer.js"></script>
</body>
</html>
